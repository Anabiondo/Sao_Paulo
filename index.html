<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .btnnav{
            border-radius: 10%;
            margin-left: 10px;
            height: 40px;
            width: 140px;
            color: rgb(134, 27, 27);
        }
        .btnnav:hover{
            background-color: rgb(7, 6, 6);
            color: rgb(255, 0, 0);
        }
        .btnfooter{
            margin-left: 10px;
            height: 50px;
            width: 150px;
            background-color: rgb(243, 14, 14);
            color: rgb(233, 8, 8);
            border:0px solid red;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            gap: 10px;
        }
        .btnfooter:hover{
            background-color: rgb(255, 253, 253);
            color: brown;
        }
        a{
            text-decoration:none;
        }

        .card{
            border: 1px red;
            color: firebrick;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* o @media serve para alterar as propriedades das tags com base no tamnho do dispositivo
        para garantir a responsividade do site, temos que verificar como fica a estilização
        em varios tamnhos de telas diferentes, pode ser que no computador fique ok, porem quando acessado
        pelo celular o site quebre. Nesse caso será necessário aplicar ajustes no tamanho de tela com
        o @media() 

        * Usamos o !important para forçar a estilização em uma tag, como a tag pode ter id e varias classes
        o html e css precisam saber qual estilo aplicar, forçamos isso usando o !important no final do atributo

        */
        @media(max-width:750px){
            bottom{
                width: 50px !important;
                height: 30px !important;
            }
        }
    </style>
</head>
<body>
